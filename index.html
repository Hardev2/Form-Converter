<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Form Converter</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="form_converter.css">
</head>
<body>

<div class="builder">
  <header class="builder-top">
    <div class="builder-brand">
      <div class="builder-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </div>
      <div>
        <h1>Form Converter</h1>
        <p>Form builder</p>
      </div>
    </div>
    <div class="builder-meta">
      <div class="stat">
        <span class="stat-value" id="statFields">0</span>
        <span class="stat-label">Fields</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statLayout">1 col</span>
        <span class="stat-label">Layout</span>
      </div>
      <div class="version-toggle" role="group" aria-label="Output version">
        <button type="button" class="version-btn" data-version="v1" onclick="setWorkspaceVersion('v1')">Version 1</button>
        <button type="button" class="version-btn active" data-version="v2" onclick="setWorkspaceVersion('v2')">Bootstrap</button>
      </div>
    </div>
  </header>

  <div class="builder-body">
    <aside class="dock dock-left" aria-label="Field editor">
      <header class="dock-head">
        <h2>Edit fields</h2>
      </header>

      <section class="dock-block">
        <h3 class="dock-block-title">Field names</h3>
        <p class="dock-hint">One label per line.</p>
        <label class="sr-only" for="fieldNames">Field names</label>
        <textarea id="fieldNames" rows="7" placeholder="Full Name&#10;Last Name&#10;Email Address"></textarea>
      </section>

      <section class="dock-block dock-block-fill">
        <h3 class="dock-block-title">Type of field</h3>
        <p class="dock-hint">Pick a type for each name.</p>
        <div id="fieldTypesList" class="types-list" aria-live="polite"></div>
      </section>
    </aside>

    <main class="stage" aria-label="Form canvas">
      <div class="stage-toolbar">
        <span class="stage-label">Free canvas</span>
        <div class="stage-toolbar-actions">
          <div class="stage-devices" aria-label="Canvas layout">
            <button type="button" class="device-btn" onclick="resetCanvasColumns()" title="1 column">1 col</button>
            <button type="button" class="device-btn" onclick="pairCanvasColumns()" title="2 columns">2 col</button>
          </div>
          <button type="button" class="btn-tool" onclick="undoCanvas()">Undo</button>
        </div>
      </div>
      <div class="stage-sheet">
        <div id="freeCanvas" class="free-canvas" aria-label="Draggable form canvas"></div>
      </div>
    </main>

    <aside class="dock dock-right" aria-label="Generated markup">
      <header class="dock-head">
        <h2>HTML PHP structure</h2>
        <div class="dock-head-actions">
          <button type="button" class="btn-tool" onclick="checkPhpStructure()">Check</button>
          <button type="button" id="copyBtn" class="btn-tool btn-tool-primary" onclick="copyOutput()">
            <span id="copyBtnText">Copy</span>
          </button>
          <button type="button" class="btn-tool" onclick="clearOutput()">Clear</button>
        </div>
      </header>
      <div id="phpStatus" class="php-status is-idle" data-state="idle">
        <button type="button" class="php-status-bar" id="phpStatusToggle" aria-expanded="false" aria-controls="phpStatusList">
          <span class="php-status-dot" aria-hidden="true"></span>
          <span class="php-status-copy">
            <span class="php-status-label" id="phpStatusLabel">Waiting</span>
            <span class="php-status-meta" id="phpStatusMeta">Markup will be checked as you build</span>
          </span>
        </button>
        <ul class="php-status-list" id="phpStatusList" hidden></ul>
      </div>
      <textarea id="output" rows="18" placeholder="Enter field names to generate PHP markup here." spellcheck="false"></textarea>
    </aside>
  </div>
</div>

<script src="form_converter.js"></script>
</body>
</html>
